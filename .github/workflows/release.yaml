name: Release packages

on:
  push:
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-name: node-shell-${{ steps.package.outputs.version }}-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check version
        id: package
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match package.json version: v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm type:check

      - name: Test
        run: pnpm test:unit

      - name: Build production package
        run: pnpm build:production

      - name: Pack
        run: |
          mkdir -p dist/release
          pnpm pack --pack-destination dist/release

      - name: Create SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: dist/release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Make checksums
        working-directory: dist/release
        run: |
          for file in *.tgz *.spdx.json; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Upload installable package
        uses: actions/upload-artifact@v7
        with:
          name: node-shell-${{ steps.package.outputs.version }}-${{ github.run_id }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/release

      - name: Verify checksums
        working-directory: dist/release
        run: sha256sum --check *.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: legacy
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Assets의 `.tgz`를 다운로드하여 FreeLens Extensions 화면에서 설치하세요.
            사용자 PC에서 Node.js/pnpm 설치나 빌드는 필요하지 않습니다.
            `Source code (zip)`과 `Source code (tar.gz)`는 설치 파일이 아닙니다.
            설치 및 업데이트: https://github.com/h-ingi/freelens-exec-node-shell/blob/${{ github.ref_name }}/docs/releases.ko.md
          files: |
            dist/release/*.tgz
            dist/release/*.tgz.sha256
            dist/release/*.spdx.json
            dist/release/*.spdx.json.sha256
